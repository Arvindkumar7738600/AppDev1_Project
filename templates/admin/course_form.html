
<!DOCTYPE html>
<html>
<head>
    <title>Course Form</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        {% if course %}
            <h1>Edit Course</h1>
        {% else %}
            <h1>Add Course</h1>
        {% endif %}

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="course_code"
                placeholder="Course Code"
                value="{{ course['course_code'] if course else '' }}"
                required
            >

            <input
                type="text"
                name="course_name"
                placeholder="Course Name"
                value="{{ course['course_name'] if course else '' }}"
                required
            >

            <textarea
                name="description"
                placeholder="Course Description"
                rows="4"
            >{{ course['description'] if course else '' }}</textarea>

            <button type="submit">
                Save Course
            </button>

        </form>

        <a href="/admin/courses" class="btn">
            Back to Courses
        </a>

    </div>

</body>
</html>
